              PT PERTA LIFE INSURANCE
            </h1>
            <p className="mt-1 hidden text-[11px] font-medium leading-none text-gray-500 sm:block">
              Created by Digital Affinity
            </p>
          </div>
        </div>

        <div className="flex shrink-0 items-center gap-1.5 sm:gap-3">
