name: One-shot Impersonation Dependency Audit

on:
  push:
    branches:
      - feat/admin-login-as-user

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Direct auth identity references
        shell: bash
        run: |
          echo '=== auth.uid() references in migrations ==='
          grep -RIn --include='*.sql' 'auth\.uid()' supabase/migrations || true
          echo
          echo '=== direct profiles auth_user_id references in app ==='
          grep -RIn --include='*.ts' --include='*.tsx' 'auth_user_id' src || true
          echo
          echo '=== current_profile_id references ==='
          grep -RIn --include='*.sql' 'current_profile_id' supabase/migrations || true

      - name: Supabase deploy credential presence
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then echo 'SUPABASE_ACCESS_TOKEN=present'; else echo 'SUPABASE_ACCESS_TOKEN=absent'; fi
          if [ -n "$SUPABASE_PROJECT_REF" ]; then echo 'SUPABASE_PROJECT_REF=present'; else echo 'SUPABASE_PROJECT_REF=absent'; fi
          if [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo 'SUPABASE_SERVICE_ROLE_KEY=present'; else echo 'SUPABASE_SERVICE_ROLE_KEY=absent'; fi
