name: One-shot Admin Login As Patch

on:
  push:
    branches:
      - feat/admin-login-as-user

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-login-as-user

      - name: Patch frontend
        run: python .github/scripts/patch_admin_impersonation.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint changed frontend files
        run: >-
          pnpm exec eslint
          src/services/adminService.ts
          src/lib/adminImpersonation.ts
          src/pages/AdministrasiPage.tsx
          src/components/layout/AppHeader.tsx
          src/pages/LoginPage.tsx
          --rule '@typescript-eslint/no-explicit-any: off'

      - name: Build application
        run: pnpm build

      - name: Commit verified implementation and cleanup
        shell: bash
        run: |
          git rm .github/workflows/one-shot-impersonation-audit.yml .github/scripts/patch_admin_impersonation.py
          git add src/services/adminService.ts src/lib/adminImpersonation.ts src/pages/AdministrasiPage.tsx src/components/layout/AppHeader.tsx src/pages/LoginPage.tsx supabase/functions/admin-impersonate/index.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(admin): add secure login-as-user flow"
          git push origin HEAD:feat/admin-login-as-user
