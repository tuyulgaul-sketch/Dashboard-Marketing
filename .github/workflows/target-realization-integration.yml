name: Target realization regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/App.tsx'
      - 'src/lib/accessControl.ts'
      - 'src/components/layout/AppSidebar.tsx'
      - 'src/components/rkap/RkapPipelineMatrixUpload.tsx'
      - 'src/hooks/useTargetRealizationPublisher.ts'
      - 'src/pages/TargetRkapPage.tsx'
      - 'src/pages/ProduksiPage.tsx'
      - 'src/pages/DirectoratePerformancePage.tsx'
      - 'src/pages/TargetRealizationUploadPage.tsx'
      - 'src/services/directoratePerformanceService.ts'
      - 'scripts/test-target-realization-navigation.mjs'
      - 'scripts/test-bulk-pipeline-single-workflow.mjs'
      - 'scripts/prepare-official-archive-regression.mjs'
      - 'scripts/test-official-upload-upsert-guard.mjs'
      - 'supabase/migrations/20260907_directorate_performance_reader_v33.sql'
      - 'supabase/migrations/20260907_official_upload_guard_v34.sql'
      - 'supabase/migrations/20260907_official_upload_upsert_guard_v34_1.sql'
      - '.github/workflows/target-realization-integration.yml'
  push:
    branches: [feat/target-realization-navigation]
    paths:
      - '.github/workflows/target-realization-integration.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --no-frozen-lockfile
          git restore -- pnpm-lock.yaml
      - name: Preserve original live feature baseline
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const BASE='9bfee0235fd36b02c8f74577dc5bea66d52c4028';
          const paths=[
            'src/lib/accessControl.ts',
            'src/pages/AktivitasUniversalPage.tsx',
            'src/pages/MarketingMeetingRoomPage.tsx',
            'src/pages/DokumenPendukungPage.tsx',
            'src/pages/DokumenAdministrasiReaderPage.tsx',
            'src/pages/TandaTerimaV14Page.tsx',
            'src/pages/AdministrasiPage.tsx',
            'src/components/common/ReleaseSyncBridge.tsx',
            'src/services/centralUserRuntime.ts',
            'src/services/targetService.ts',
            'src/services/masterDataService.ts',
            'src/services/businessFileStorage.ts',
            'src/services/pipelineFileStorage.ts',
          ];
          const snapshot=Object.fromEntries(paths.map(path=>[path,execFileSync('git',['show',`${BASE}:${path}`],{encoding:'utf8'})]));
          snapshot['src/lib/accessControl.ts']=readFileSync('src/lib/accessControl.ts','utf8');
          writeFileSync('/tmp/restore-preserved-files.json',JSON.stringify(snapshot));
          for(const [path,expected] of Object.entries(snapshot)) assert.equal(readFileSync(path,'utf8'),expected,`Live feature changed: ${path}`);
          console.log('Existing live feature files preserved, including Tanda Terima photo preview.');
          NODE
      - name: Prepare approved archive navigation fixture
        run: node scripts/prepare-official-archive-regression.mjs
      - name: Run navigation, upload guard and existing regressions
        run: |
          node scripts/test-bulk-pipeline-single-workflow.mjs
          # Preserve the released photo-preview feature byte-for-byte; its
          # one-time integration fixture requires a separate jsdom setup.
          node --experimental-strip-types --test \
            scripts/test-target-realization-navigation.mjs \
            scripts/test-official-upload-upsert-guard.mjs \
            scripts/test-restored-business.mjs \
            scripts/test-admin-document-access.mjs \
            scripts/test-admin-document-reader.mjs \
            scripts/test-admin-document-browse.mjs \
            scripts/test-admin-product-search.mjs \
            scripts/test-marketing-tool-browse.mjs \
            scripts/test-document-handover-sort.mjs
      - name: Reject new TypeScript and lint diagnostics
        run: |
          git worktree add --detach /tmp/target-baseline 9bfee0235fd36b02c8f74577dc5bea66d52c4028
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/target-baseline/node_modules
          (cd /tmp/target-baseline && "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit -p tsconfig.app.json > /tmp/target-ts-before.txt 2>&1 || true)
          pnpm exec tsc --noEmit -p tsconfig.app.json > /tmp/target-ts-after.txt 2>&1 || true
          paths=(src/App.tsx src/lib/accessControl.ts src/components/layout/AppSidebar.tsx src/pages/TargetRkapPage.tsx src/pages/ProduksiPage.tsx)
          (cd /tmp/target-baseline && "$GITHUB_WORKSPACE/node_modules/.bin/eslint" "${paths[@]}" > /tmp/target-lint-before.txt 2>&1 || true)
          pnpm exec eslint "${paths[@]}" src/pages/DirectoratePerformancePage.tsx src/pages/TargetRealizationUploadPage.tsx src/components/rkap/RkapPipelineMatrixUpload.tsx src/services/directoratePerformanceService.ts src/hooks/useTargetRealizationPublisher.ts > /tmp/target-lint-after.txt 2>&1 || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines=p=>readFileSync(p,'utf8').split('\n');
          const count=items=>{const m=new Map();for(const item of items)m.set(item,(m.get(item)||0)+1);return m;};
          const errors=p=>lines(p).filter(s=>/^.+\(\d+,\d+\): error TS\d+:/.test(s)).map(s=>s.replace(/\(\d+,\d+\)/,''));
          const before=count(errors('/tmp/target-ts-before.txt'));
          const after=count(errors('/tmp/target-ts-after.txt'));
          const added=[...after].filter(([message,n])=>n>(before.get(message)||0));
          console.log(`TypeScript baseline: ${[...before.values()].reduce((a,b)=>a+b,0)}; current: ${[...after.values()].reduce((a,b)=>a+b,0)}; new diagnostics: ${added.length}.`);
          if(added.length){console.error(added);process.exitCode=1;}
          const lint=p=>lines(p).filter(s=>/^\s*\d+:\d+\s+(error|warning)\s+/.test(s)).map(s=>s.replace(/^\s*\d+:\d+/,''));
          const oldLint=count(lint('/tmp/target-lint-before.txt'));
          const newLint=count(lint('/tmp/target-lint-after.txt'));
          const addedLint=[...newLint].filter(([message,n])=>n>(oldLint.get(message)||0));
          console.log(`New lint diagnostics: ${addedLint.length}.`);
          if(addedLint.length){console.error(addedLint);process.exitCode=1;}
          NODE
      - name: Verify production build
        run: pnpm run build
