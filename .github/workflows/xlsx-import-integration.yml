name: XLSX import integration
on:
  push:
    branches: [feat/xlsx-user-id-imports]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  finalize:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[xlsx-finalize]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
      - name: Apply minimal source corrections
        run: |
          node scripts/patch-xlsx-release.mjs
          node scripts/fix-xlsx-types.mjs
      - name: Native XLSX roundtrip
        run: node scripts/test-marketing-xlsx.mjs
      - name: Reject new lint and TypeScript diagnostics
        run: node scripts/check-xlsx-regression.mjs
      - name: Production build
        run: pnpm run build
      - name: Commit verified source to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/marketingWorkbook.ts src/pages/TargetRkapPage.tsx src/pages/ProduksiPage.tsx scripts/test-marketing-xlsx.mjs
          git diff --cached --check
          git commit -m 'fix(xlsx): harden native imports and ownership checks [xlsx-integrated]'
          git push origin HEAD:feat/xlsx-user-id-imports
  verify:
    if: github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[xlsx-integrated]') || contains(github.event.head_commit.message, '[xlsx-verify]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
      - name: Native XLSX regression
        run: node scripts/test-marketing-xlsx.mjs
      - name: Existing business and navigation regressions
        run: |
          node --experimental-strip-types --test \
            scripts/test-target-realization-navigation.mjs \
            scripts/test-official-upload-upsert-guard.mjs \
            scripts/test-restored-business.mjs \
            scripts/test-admin-document-access.mjs \
            scripts/test-admin-document-reader.mjs \
            scripts/test-admin-document-browse.mjs \
            scripts/test-admin-product-search.mjs \
            scripts/test-marketing-tool-browse.mjs \
            scripts/test-document-handover-sort.mjs
      - name: Reject new lint and TypeScript diagnostics
        run: node scripts/check-xlsx-regression.mjs
      - name: Production build
        run: pnpm run build
