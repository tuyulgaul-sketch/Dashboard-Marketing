name: Fact Finding integration check
on:
  push:
    branches: [feat/admin-fact-finding]
    paths:
      - 'scripts/apply-admin-fact-finding.mjs'
      - '.github/workflows/admin-fact-finding-check.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-fact-finding
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact source edits
        run: node scripts/apply-admin-fact-finding.mjs
      - name: Run document and RBAC regression tests
        run: node --experimental-strip-types --test scripts/test-admin-document-reader.mjs scripts/test-admin-document-access.mjs
      - name: Install and verify production build
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --no-frozen-lockfile
          pnpm run build
      - name: Commit only reviewed application source changes
        run: |
          git add src/services/store.ts src/pages/DokumenPendukungPage.tsx src/pages/DokumenAdministrasiReaderPage.tsx
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(docs): integrate Fact Finding into administration workflow'
          git push origin HEAD:refs/heads/feat/admin-fact-finding
