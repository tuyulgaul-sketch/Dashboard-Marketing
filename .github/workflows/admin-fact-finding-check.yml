name: Fact Finding integration check
on:
  push:
    branches: [feat/admin-fact-finding]
    paths:
      - 'scripts/inspect-admin-fact-finding.mjs'
      - '.github/workflows/admin-fact-finding-check.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/inspect-admin-fact-finding.mjs
