name: Target realization source inspection
on:
  push:
    branches: [feat/target-realization-navigation]
    paths:
      - 'scripts/inspect-target-realization.mjs'
      - '.github/workflows/target-realization-inspect.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --no-frozen-lockfile
          git restore -- pnpm-lock.yaml
      - run: node scripts/inspect-target-realization.mjs
