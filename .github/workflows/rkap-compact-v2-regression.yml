name: RKAP compact v2 regression
on:
  push:
    branches: [feat/rkap-compact-v2]
  pull_request:
    branches: [main]
    paths:
      - 'src/utils/rkapPipelineCompact.ts'
      - 'src/utils/rkapPipelineReporting.ts'
      - 'src/utils/rkapPipelineCompactWorkbook.ts'
      - 'src/utils/rkapPipelineCompactImport.ts'
      - 'src/components/rkap/RkapPipelineMatrixUpload.tsx'
      - 'scripts/test-rkap-pipeline-compact.mjs'
      - 'scripts/test-rkap-pipeline-matrix.mjs'
      - '.github/workflows/rkap-compact-v2-regression.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
      - name: Compact pipeline regression
        run: node scripts/test-rkap-pipeline-compact.mjs
      - name: Existing pipeline and target regressions
        run: |
          node scripts/test-rkap-pipeline-matrix.mjs
          node scripts/test-marketing-xlsx.mjs
          node scripts/test-compact-target.mjs
      - name: TypeScript
        run: pnpm exec tsc --noEmit -p tsconfig.app.json
      - name: Lint changed source
        run: pnpm exec eslint src/utils/rkapPipelineCompact.ts src/utils/rkapPipelineReporting.ts src/utils/rkapPipelineCompactWorkbook.ts src/utils/rkapPipelineCompactImport.ts src/components/rkap/RkapPipelineMatrixUpload.tsx
      - name: Production build
        run: pnpm run build
