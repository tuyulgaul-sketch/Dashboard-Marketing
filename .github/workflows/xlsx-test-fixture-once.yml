name: XLSX historical fixture update
on:
  push:
    branches: [feat/xlsx-user-id-imports]
    paths:
      - '.github/workflows/xlsx-test-fixture-once.yml'
permissions:
  contents: read
jobs:
  update-fixture:
    if: contains(github.event.head_commit.message, '[xlsx-test-fixture]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
      - name: Update only the obsolete source snapshot
        run: node scripts/upgrade-target-realization-regression.mjs
      - name: Prepare preserved live-feature fixture
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import assert from 'node:assert/strict';
          const BASE='9bfee0235fd36b02c8f74577dc5bea66d52c4028';
          const paths=[
            'src/lib/accessControl.ts',
            'src/pages/AktivitasUniversalPage.tsx',
            'src/pages/MarketingMeetingRoomPage.tsx',
            'src/pages/DokumenPendukungPage.tsx',
            'src/pages/DokumenAdministrasiReaderPage.tsx',
            'src/pages/TandaTerimaV14Page.tsx',
            'src/pages/AdministrasiPage.tsx',
            'src/components/common/ReleaseSyncBridge.tsx',
            'src/services/centralUserRuntime.ts',
            'src/services/targetService.ts',
            'src/services/masterDataService.ts',
            'src/services/businessFileStorage.ts',
            'src/services/pipelineFileStorage.ts',
          ];
          const snapshot=Object.fromEntries(paths.map(path=>[path,execFileSync('git',['show',`${BASE}:${path}`],{encoding:'utf8'})]));
          snapshot['src/lib/accessControl.ts']=readFileSync('src/lib/accessControl.ts','utf8');
          writeFileSync('/tmp/restore-preserved-files.json',JSON.stringify(snapshot));
          for(const [path,expected] of Object.entries(snapshot)) assert.equal(readFileSync(path,'utf8'),expected,`Live feature changed: ${path}`);
          console.log('Existing live feature files preserved, including Tanda Terima photo preview.');
          NODE
      - name: Run existing and native XLSX regressions
        run: |
          node scripts/test-marketing-xlsx.mjs
          node --experimental-strip-types --test \
            scripts/test-target-realization-navigation.mjs \
            scripts/test-official-upload-upsert-guard.mjs \
            scripts/test-restored-business.mjs \
            scripts/test-admin-document-access.mjs \
            scripts/test-admin-document-reader.mjs \
            scripts/test-admin-document-browse.mjs \
            scripts/test-admin-product-search.mjs \
            scripts/test-marketing-tool-browse.mjs \
            scripts/test-document-handover-sort.mjs
      - name: Verify static analysis and build
        run: |
          node scripts/check-xlsx-regression.mjs
          pnpm run build
      - name: Commit only the verified regression fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-target-realization-navigation.mjs
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'test(xlsx): recognize approved upload source baseline'
          git push origin HEAD:feat/xlsx-user-id-imports
