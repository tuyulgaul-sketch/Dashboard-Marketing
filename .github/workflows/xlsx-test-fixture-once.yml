name: XLSX historical fixture update
on:
  push:
    branches: [feat/xlsx-user-id-imports]
    paths:
      - '.github/workflows/xlsx-test-fixture-once.yml'
permissions:
  contents: read
jobs:
  update-fixture:
    if: contains(github.event.head_commit.message, '[xlsx-test-fixture]')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
      - name: Update only the obsolete source snapshot
        run: node scripts/upgrade-target-realization-regression.mjs
      - name: Run existing and native XLSX regressions
        run: |
          node scripts/test-marketing-xlsx.mjs
          node --experimental-strip-types --test \
            scripts/test-target-realization-navigation.mjs \
            scripts/test-official-upload-upsert-guard.mjs \
            scripts/test-restored-business.mjs \
            scripts/test-admin-document-access.mjs \
            scripts/test-admin-document-reader.mjs \
            scripts/test-admin-document-browse.mjs \
            scripts/test-admin-product-search.mjs \
            scripts/test-marketing-tool-browse.mjs \
            scripts/test-document-handover-sort.mjs
      - name: Verify static analysis and build
        run: |
          node scripts/check-xlsx-regression.mjs
          pnpm run build
      - name: Commit only the verified regression fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/test-target-realization-navigation.mjs
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'test(xlsx): recognize approved upload source baseline'
          git push origin HEAD:feat/xlsx-user-id-imports
