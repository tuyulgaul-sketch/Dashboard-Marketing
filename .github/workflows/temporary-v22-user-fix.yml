name: Temporary V22 targeted frontend patch

on:
  push:
    branches:
      - fix/release-sync-hardening-v20
    paths:
      - scripts/temporary-v22-user-fix.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-sync-hardening-v20
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact targeted patch
        run: node scripts/temporary-v22-user-fix.mjs

      - name: Commit targeted source changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/documentHandoverV14Service.ts src/components/ui/select.tsx
          git commit -m "Open Tanda Terima registry and force pickers downward"
          git push origin HEAD:fix/release-sync-hardening-v20
