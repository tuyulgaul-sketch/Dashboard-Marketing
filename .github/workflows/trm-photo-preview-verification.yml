name: Tanda Terima photo preview verification
on:
  push:
    branches: [feat/tanda-terima-photo-preview]
    paths:
      - 'scripts/integrate-trm-photo-preview.mjs'
      - 'scripts/test-trm-photo-preview.mjs'
      - 'src/lib/handoverPhotoPreview.ts'
      - 'src/components/tandaTerima/HandoverEvidencePreview.tsx'
      - '.github/workflows/trm-photo-preview-verification.yml'
permissions:
  contents: write
concurrency:
  group: trm-photo-preview-integration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tanda-terima-photo-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies and isolated DOM test tools
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --no-frozen-lockfile
          git restore -- pnpm-lock.yaml
          mkdir -p /tmp/trm-preview-test
          npm install --prefix /tmp/trm-preview-test --no-save --no-package-lock --ignore-scripts jsdom@26.1.0 esbuild@0.27.7
      - name: Apply exact source integration
        run: |
          node scripts/integrate-trm-photo-preview.mjs
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const replaceOnce = (path, before, after) => {
            const source = readFileSync(path, 'utf8');
            assert.equal(source.split(before).length, 2, `Unexpected patch anchor in ${path}`);
            writeFileSync(path, source.replace(before, after));
          };
          replaceOnce('scripts/test-trm-photo-preview.mjs', 'new Module(filename, module)', 'new Module(filename)');
          replaceOnce('scripts/test-trm-photo-preview.mjs', "require('esbuild')", "testRequire('esbuild')");
          replaceOnce('src/components/tandaTerima/HandoverEvidencePreview.tsx', '            aria-describedby={undefined}\n', '');
          NODE
      - name: Run preview behavior and preservation tests
        run: node --experimental-strip-types --test scripts/test-trm-photo-preview.mjs
      - name: Run existing Tanda Terima regression and RBAC tests
        run: |
          files=()
          for file in scripts/test-document-handover-sort.mjs scripts/test-tanda-terima-sort.mjs scripts/test-admin-document-access.mjs; do
            if [ -f "$file" ]; then files+=("$file"); fi
          done
          if [ ${#files[@]} -gt 0 ]; then node --experimental-strip-types --test "${files[@]}"; fi
      - name: Reject new TypeScript and lint diagnostics
        run: |
          git worktree add --detach /tmp/trm-baseline "$(git merge-base origin/main HEAD)"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/trm-baseline/node_modules
          (cd /tmp/trm-baseline && "$GITHUB_WORKSPACE/node_modules/.bin/tsc" --noEmit -p tsconfig.app.json > /tmp/trm-ts-before.txt 2>&1 || true)
          pnpm exec tsc --noEmit -p tsconfig.app.json > /tmp/trm-ts-after.txt 2>&1 || true
          (cd /tmp/trm-baseline && "$GITHUB_WORKSPACE/node_modules/.bin/eslint" src/pages/TandaTerimaV14Page.tsx > /tmp/trm-lint-before.txt 2>&1 || true)
          pnpm exec eslint src/pages/TandaTerimaV14Page.tsx src/components/tandaTerima/HandoverEvidencePreview.tsx src/lib/handoverPhotoPreview.ts > /tmp/trm-lint-after.txt 2>&1 || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = path => readFileSync(path, 'utf8').split('\n');
          const errors = path => lines(path).filter(line => /^.+\(\d+,\d+\): error TS\d+:/.test(line)).map(line => line.replace(/\(\d+,\d+\)/, ''));
          const before = errors('/tmp/trm-ts-before.txt');
          const after = errors('/tmp/trm-ts-after.txt');
          const added = after.filter(error => !new Set(before).has(error));
          console.log(`TypeScript baseline: ${before.length}; current: ${after.length}; new: ${added.length}.`);
          if (added.length) { console.error(added.join('\n')); process.exitCode = 1; }
          const lint = path => lines(path).filter(line => /^\s*\d+:\d+\s+(error|warning)\s+/.test(line)).map(line => line.replace(/^\s*\d+:\d+/, ''));
          const oldLint = new Set(lint('/tmp/trm-lint-before.txt'));
          const newLint = lint('/tmp/trm-lint-after.txt').filter(line => !oldLint.has(line));
          console.log(`New lint diagnostics: ${newLint.length}.`);
          if (newLint.length) { console.error(newLint.join('\n')); process.exitCode = 1; }
          NODE
      - name: Verify production build
        run: pnpm run build
      - name: Commit verified application integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/TandaTerimaV14Page.tsx src/components/tandaTerima/HandoverEvidencePreview.tsx scripts/test-trm-photo-preview.mjs
          git diff --cached --quiet && exit 0
          git commit -m 'feat(trm): integrate verified private photo lightbox'
          git push origin HEAD:feat/tanda-terima-photo-preview
