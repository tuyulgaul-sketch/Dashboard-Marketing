name: Broker source finalizer
on:
  push:
    branches:
      - fix/broker-ojk-status-semantics
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/broker-ojk-status-semantics
          fetch-depth: 0
      - name: Patch manual Broker workflow
        shell: python
        run: |
          from pathlib import Path
          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text(); n=s.count(old)
              if n < count: raise SystemExit(f'{path}: expected at least {count}, found {n}: {old[:80]!r}')
              p.write_text(s.replace(old,new,count))
          p='src/pages/BookingPipelinePage.tsx'
          rep(p,"  const [brokerStatusFilter, setBrokerStatusFilter] =\n    useState<'ALL' | 'Active' | 'Inactive'>('ALL');\n\n",'')
          rep(p,"      status:\n        'Active',\n",'',1)
          rep(p,"  const filteredBrokers =\n    brokers\n      .filter(\n        broker =>\n          brokerStatusFilter ===\n            'ALL' ||\n          broker.status ===\n            brokerStatusFilter\n      )\n      .filter(\n        broker => {","  const filteredBrokers =\n    brokers\n      .filter(\n        broker => {")
          rep(p,"'Broker yang dipilih sudah tidak aktif / tidak tersedia di Master Broker. Pilih broker aktif lainnya.'","'Broker yang dipilih sudah tidak tersedia di Master Broker. Pilih broker lainnya.'")
          rep(p,'Daftar hanya menampilkan broker berstatus Active pada Master Broker yang dikelola System Admin.','Daftar broker mengikuti Master Broker. Status perizinan Broker tidak ditetapkan atau dipelihara oleh PertaLife.')
          rep(p,"                  {brokers.filter(\n                    broker =>\n                      broker.status ===\n                      'Active'\n                  ).length}",'                  {brokers.length}')
          rep(p,'                  <div className="grid gap-3 md:grid-cols-[1fr_220px]">','                  <div>',1)
          rep(p,'''\n                    <select\n                      value={brokerStatusFilter}\n                      onChange={event =>\n                        setBrokerStatusFilter(\n                          event.target.value as\n                            | 'ALL'\n                            | 'Active'\n                            | 'Inactive'\n                        )\n                      }\n                      className="h-10 rounded-md border border-gray-200 bg-white px-3 text-xs font-semibold"\n                    >\n                      <option value="ALL">Semua Status</option>\n                      <option value="Active">Active</option>\n                      <option value="Inactive">Inactive</option>\n                    </select>''','')
          rep(p,'''                  <div className="flex flex-wrap items-center gap-2 text-[11px] text-gray-500">\n                    <Badge variant="outline">\n                      {filteredBrokers.length} tampil\n                    </Badge>\n                    <span>\n                      {brokers.filter(\n                        broker =>\n                          broker.status ===\n                          'Active'\n                      ).length} Active\n                    </span>\n                    <span>•</span>\n                    <span>\n                      {brokers.filter(\n                        broker =>\n                          broker.status ===\n                          'Inactive'\n                      ).length} Inactive\n                    </span>\n                  </div>''','''                  <div className="flex flex-wrap items-center gap-2 text-[11px] text-gray-500">\n                    <Badge variant="outline">{filteredBrokers.length} broker tampil</Badge>\n                    <span>Status perizinan mengikuti sumber OJK dan tidak dikelola PertaLife.</span>\n                  </div>''')
          rep(p,'                          <th className="p-3">Status</th>\n','',1)
          rep(p,'''\n                              <td className="p-3">\n                                <Badge\n                                  variant="outline"\n                                  className={\n                                    broker.status ===\n                                    'Active'\n                                      ? 'border-emerald-300 bg-emerald-50 text-emerald-800'\n                                      : 'border-gray-300 bg-gray-100 text-gray-600'\n                                  }\n                                >\n                                  {broker.status}\n                                </Badge>\n                              </td>\n''','\n')
          rep(p,'''\n                                  <Button\n                                    type="button"\n                                    variant="outline"\n                                    size="sm"\n                                    onClick={() =>\n                                      store.setBrokerStatus(\n                                        broker.id,\n                                        broker.status ===\n                                          'Active'\n                                          ? 'Inactive'\n                                          : 'Active'\n                                      )\n                                    }\n                                    className="h-7 text-[10px]"\n                                  >\n                                    {broker.status ===\n                                    'Active'\n                                      ? 'Nonaktifkan'\n                                      : 'Aktifkan'}\n                                  </Button>\n''','\n')
          rep(p,'Perubahan Master Broker tercatat pada Audit Trail. Booking Case hanya menampilkan broker berstatus Active.','Perubahan Master Broker tercatat pada Audit Trail. Status perizinan Broker mengikuti sumber OJK dan tidak ditetapkan oleh PertaLife.')
          rep(p,'''\n                <div>\n                  <label className="mb-1 block text-xs font-bold text-gray-700">\n                    Status\n                  </label>\n\n                  <select\n                    value={editingBroker.status}\n                    onChange={event =>\n                      setEditingBroker(\n                        previous =>\n                          previous\n                            ? {\n                                ...previous,\n                                status:\n                                  event.target.value as\n                                    | 'Active'\n                                    | 'Inactive',\n                              }\n                            : previous\n                      )\n                    }\n                    className="h-10 w-full rounded-md border border-gray-200 bg-white px-3 text-xs"\n                  >\n                    <option value="Active">Active</option>\n                    <option value="Inactive">Inactive</option>\n                  </select>\n                </div>\n''','\n')
          rep('src/data/brokerMasterData.ts',"  status: 'Active' | 'Inactive';","  /** Legacy compatibility only; not a PertaLife or OJK license determination. */\n  status?: 'Active' | 'Inactive';")
          s='src/services/store.ts'
          rep(s,"      newBroker.status,\n      undefined,\n      `Added broker ${newBroker.companyName}`","      undefined,\n      undefined,\n      `Added broker ${newBroker.companyName}; regulatory status is not maintained by PertaLife`")
          rep(s,"      previous.status,\n      updated.status,\n      undefined,\n      `Updated broker ${updated.companyName}`","      undefined,\n      undefined,\n      undefined,\n      `Updated broker ${updated.companyName}; regulatory status is not maintained by PertaLife`")
          rep(s,'''\n  public setBrokerStatus(\n    brokerId: string,\n    status:\n      | 'Active'\n      | 'Inactive'\n  ) {\n    const broker =\n      this.getBrokers().find(\n        item =>\n          item.id ===\n          brokerId\n      );\n\n    if (\n      !broker\n    ) {\n      throw new Error(\n        'Broker tidak ditemukan.'\n      );\n    }\n\n    this.updateBroker({\n      ...broker,\n      status,\n    });\n  }\n''','\n')
          rep(s,"      broker.status,\n      undefined,\n      undefined,\n      `Deleted broker ${broker.companyName}`","      undefined,\n      undefined,\n      undefined,\n      `Deleted broker ${broker.companyName}; regulatory status is not maintained by PertaLife`")
          t=Path('scripts/test-master-intermediary-bulk.mjs'); x=t.read_text()
          a="const masterService = readFileSync('src/services/masterDataService.ts', 'utf8');\n"
          if "const bookingPage =" not in x:
              x=x.replace(a,a+"const bookingPage = readFileSync('src/pages/BookingPipelinePage.tsx', 'utf8');\nconst legacyStore = readFileSync('src/services/store.ts', 'utf8');\nconst brokerData = readFileSync('src/data/brokerMasterData.ts', 'utf8');\n")
          m="  assert.doesNotMatch(page, /Daftar Agent\\.xlsx|Daftar Broker\\.xlsx/);\n});"
          r="""  assert.doesNotMatch(page, /Daftar Agent\\.xlsx|Daftar Broker\\.xlsx/);\n  assert.doesNotMatch(bookingPage, /brokerStatusFilter|setBrokerStatus|editingBroker\\.status|broker\\.status ===/);\n  assert.doesNotMatch(bookingPage, /Broker.*berstatus Active|broker berstatus Active/i);\n  assert.doesNotMatch(legacyStore, /public setBrokerStatus\\(/);\n  assert.match(brokerData, /Legacy compatibility only; not a PertaLife or OJK license determination/);\n});"""
          if m not in x: raise SystemExit('test anchor missing')
          t.write_text(x.replace(m,r,1))
      - name: Commit source correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/BookingPipelinePage.tsx src/services/store.ts src/data/brokerMasterData.ts scripts/test-master-intermediary-bulk.mjs
          git commit -m "fix(master): remove Broker status from manual workflows"
          git push origin HEAD:fix/broker-ojk-status-semantics
