name: Broker finalizer guard fix
on:
  push:
    branches:
      - fix/broker-ojk-status-semantics
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/broker-ojk-status-semantics
          fetch-depth: 0
      - name: Relax exact replacement guard and self-clean
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/broker-finalizer-push.yml')
          s=p.read_text()
          old="if n != count: raise SystemExit"
          new="if n < count: raise SystemExit"
          if old not in s:
              raise SystemExit('guard anchor not found')
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/broker-finalizer-fix.yml').unlink()
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore(master): fix Broker finalizer guard"
          git push origin HEAD:fix/broker-ojk-status-semantics
