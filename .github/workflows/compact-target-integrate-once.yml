# One-time guarded integration. Full-year replacement requires all 24 NB/RN periods per active user.
name: Compact target guarded integration
on:
  push:
    branches: [feat/compact-target-import]
    paths:
      - '.github/workflows/compact-target-integrate-once.yml'
permissions:
  contents: read
jobs:
  integrate:
    if: contains(github.event.head_commit.message, '[compact-integrate]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --frozen-lockfile
      - name: Harden and integrate only approved target source
        run: |
          node scripts/harden-compact-target.mjs
          node scripts/integrate-compact-target.mjs
          node scripts/upgrade-compact-target-regressions.mjs
          git diff --check
          git diff --name-only
      - name: Compact and native workbook tests
        run: |
          node scripts/test-compact-target.mjs
          node scripts/test-marketing-xlsx.mjs
      - name: Existing business, navigation and security regressions
        run: |
          node -e "const fs=require('fs'),cp=require('child_process');const paths=['src/services/centralBusinessService.ts','src/services/centralBusinessStorageRuntime.ts','src/services/centralTargetRuntime.ts','src/services/targetService.ts','src/contexts/AuthContext.tsx','src/pages/BookingPipelinePage.tsx','src/pages/TandaTerimaV14Page.tsx','src/pages/DokumenPendukungPage.tsx','src/pages/DokumenAdministrasiReaderPage.tsx','src/pages/AktivitasUniversalPage.tsx','src/pages/MarketingMeetingRoomPage.tsx','src/services/documentHandoverFileStorage.ts'];const result={};for(const p of paths)result[p]=cp.execFileSync('git',['show','9bfee0235fd36b02c8f74577dc5bea66d52c4028:'+p],{encoding:'utf8'});fs.writeFileSync('/tmp/restore-preserved-files.json',JSON.stringify(result));"
          node --experimental-strip-types --test \
            scripts/test-target-realization-navigation.mjs \
            scripts/test-official-upload-upsert-guard.mjs \
            scripts/test-restored-business.mjs \
            scripts/test-admin-document-access.mjs \
            scripts/test-admin-document-reader.mjs \
            scripts/test-admin-document-browse.mjs \
            scripts/test-admin-product-search.mjs \
            scripts/test-marketing-tool-browse.mjs \
            scripts/test-document-handover-sort.mjs
      - name: Static analysis and production build
        run: |
          node scripts/check-xlsx-regression.mjs
          pnpm exec eslint src/utils/targetCompact.ts
          pnpm run build
      - name: Commit only verified source and test changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/targetCompact.ts src/utils/marketingWorkbook.ts src/pages/TargetRkapPage.tsx scripts/integrate-compact-target.mjs scripts/test-compact-target.mjs scripts/test-marketing-xlsx.mjs scripts/test-target-realization-navigation.mjs
          git diff --cached --check
          git diff --cached --name-only
          git diff --cached --quiet && exit 0
          git commit -m 'feat(target): integrate complete compact monthly upload with existing validation'
          git push origin HEAD:feat/compact-target-import
