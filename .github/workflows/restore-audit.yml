name: Restore capped modules source audit
on:
  push:
    branches: [feat/restore-capped-business-modules]
    paths:
      - 'scripts/audit-capped-restore.mjs'
      - '.github/workflows/restore-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --no-frozen-lockfile
      - name: Inspect source only
        run: node scripts/audit-capped-restore.mjs
