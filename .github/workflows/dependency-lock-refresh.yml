name: Refresh Lockfile for Zod Reduction
on:
  push:
    branches: [security/mfa-onboarding-and-session-guard-20261119]
    paths: [package.json]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/mfa-onboarding-and-session-guard-20261119
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): remove unused vulnerable dependency from lockfile"
            git push origin HEAD:security/mfa-onboarding-and-session-guard-20261119
          fi
