name: Temporary targeted activity sync patch

on:
  push:
    branches:
      - fix/release-sync-hardening-v20
    paths:
      - scripts/temporary-activity-sync-patch.mjs

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-sync-hardening-v20
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply exact targeted patch
        run: node scripts/temporary-activity-sync-patch.mjs

      - name: Commit targeted source change
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AktivitasUniversalPage.tsx
          git commit -m "Keep open activity detail synchronized across accounts"
          git push origin HEAD:fix/release-sync-hardening-v20
