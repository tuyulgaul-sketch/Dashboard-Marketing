name: Apply target Excel setup
on:
  push:
    branches: [feat/target-setup-excel-validator]
    paths:
      - 'scripts/target-excel-setup.patch.gz.b64'
      - '.github/workflows/apply-target-excel-setup.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed patch
        run: |
          base64 -d scripts/target-excel-setup.patch.gz.b64 | gzip -d > /tmp/target-excel-setup.patch
          git apply --check /tmp/target-excel-setup.patch
          git apply /tmp/target-excel-setup.patch
      - name: Commit feature and remove temporary installer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/target-excel-setup.patch.gz.b64 .github/workflows/apply-target-excel-setup.yml
          git add src/utils/marketingWorkbook.ts src/pages/TargetRkapPage.tsx src/pages/TargetRealizationUploadPage.tsx scripts/test-marketing-xlsx.mjs scripts/test-target-cascading.mjs
          git commit -m 'feat(target): switch setup to Excel with formula validation'
          git push origin HEAD:feat/target-setup-excel-validator
