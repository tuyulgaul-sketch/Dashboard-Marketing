name: Apply target Excel workbook integration
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feature/excel-target-setup-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/patch-target-workbook.py
      - name: Commit integration
        run: |
          rm scripts/patch-target-workbook.py
          rm .github/workflows/apply-target-excel-workbook.yml
          git config user.name "Dashboard Marketing Automation"
          git config user.email "dashboard-marketing@users.noreply.github.com"
          git add -A
          git commit -m "feat(target): integrate validation workbook into template download"
          git push origin HEAD:feature/excel-target-setup-validation
