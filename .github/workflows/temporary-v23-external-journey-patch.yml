name: Temporary V23 Tanda Terima Journey Patch

on:
  push:
    branches:
      - feat/tanda-terima-external-journey-v23
    paths:
      - scripts/temporary-v23-service-patch.mjs
      - scripts/temporary-v23-page-patch.mjs
      - .github/workflows/temporary-v23-external-journey-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tanda-terima-external-journey-v23
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch service
        run: node scripts/temporary-v23-service-patch.mjs

      - name: Patch page
        run: node scripts/temporary-v23-page-patch.mjs

      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/documentHandoverV14Service.ts src/pages/TandaTerimaV14Page.tsx
          git commit -m "Add external Tanda Terima journey tracking"
          git push origin HEAD:feat/tanda-terima-external-journey-v23
