name: Handover Source Export

on:
  push:
    branches:
      - handover/export-2026-09-04

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production baseline
        uses: actions/checkout@v4
        with:
          path: Dashboard-Marketing

      - name: Remove VCS metadata and temporary exporter
        shell: bash
        run: |
          rm -rf Dashboard-Marketing/.git
          rm -f Dashboard-Marketing/.github/workflows/handover-source-export.yml

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: Dashboard-Marketing-source-8efc817
          path: Dashboard-Marketing
          if-no-files-found: error
          retention-days: 7
