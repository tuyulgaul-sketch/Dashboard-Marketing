name: Fix target Excel regression assertion
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/feat/target-setup-excel-validator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update stale target template assertion
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/test-marketing-xlsx.mjs')
          s=p.read_text()
          old="assert.match(targetSource, /downloadMarketingWorkbook\\('target'/);"
          new="assert.match(targetSource, /downloadTargetSetupWorkbook\\(/);"
          if old not in s:
              raise SystemExit('stale assertion not found')
          p.write_text(s.replace(old,new,1))
      - name: Cleanup and commit
        run: |
          rm .github/workflows/fix-target-excel-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(target): align XLSX regression with Excel-first setup"
          git push origin HEAD:feat/target-setup-excel-validator
