name: Marketing Tools browser verification
on:
  push:
    branches: [feat/marketing-tools-product-first]
    paths:
      - 'scripts/apply-marketing-tool-browser.mjs'
      - '.github/workflows/marketing-tools-browser-check.yml'
concurrency:
  group: marketing-tools-browser
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/marketing-tools-product-first
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm install --no-frozen-lockfile
          git restore -- pnpm-lock.yaml
      - name: Capture existing diagnostics
        run: |
          pnpm exec tsc --noEmit -p tsconfig.app.json > /tmp/tools-ts-before.txt 2>&1 || true
          pnpm exec eslint src/pages/DokumenPendukungPage.tsx > /tmp/tools-lint-before.txt 2>&1 || true
      - name: Integrate reviewed page
        run: node scripts/apply-marketing-tool-browser.mjs
      - name: Run catalogue and integration regressions
        run: node --experimental-strip-types --test scripts/test-marketing-tool-browse.mjs
      - name: Lint new components and helper
        run: pnpm exec eslint src/lib/marketingToolBrowse.ts src/components/documents/MarketingToolBrowser.tsx
      - name: Verify production build
        run: pnpm run build
      - name: Reject new TypeScript diagnostics
        run: |
          pnpm exec tsc --noEmit -p tsconfig.app.json > /tmp/tools-ts-after.txt 2>&1 || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const errors = path => readFileSync(path, 'utf8').split('\n')
            .filter(line => /^.+\(\d+,\d+\): error TS\d+:/.test(line))
            .map(line => line.replace(/\(\d+,\d+\)/, ''));
          const before = errors('/tmp/tools-ts-before.txt');
          const after = errors('/tmp/tools-ts-after.txt');
          const baseline = new Set(before);
          const added = after.filter(error => !baseline.has(error));
          console.log(`TypeScript baseline: ${before.length}; current: ${after.length}; new: ${added.length}.`);
          if (added.length) { console.error(added.join('\n')); process.exit(1); }
          NODE
      - name: Reject new page lint diagnostics
        run: |
          pnpm exec eslint src/pages/DokumenPendukungPage.tsx > /tmp/tools-lint-after.txt 2>&1 || true
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const lines = path => readFileSync(path, 'utf8').split('\n')
            .filter(line => /^\s*\d+:\d+\s+(error|warning)\s+/.test(line))
            .map(line => line.replace(/^\s*\d+:\d+/, ''));
          const baseline = new Set(lines('/tmp/tools-lint-before.txt'));
          const added = lines('/tmp/tools-lint-after.txt').filter(line => !baseline.has(line));
          console.log(`New page lint diagnostics: ${added.length}.`);
          if (added.length) { console.error(added.join('\n')); process.exit(1); }
          NODE
      - name: Commit reviewed application integration
        run: |
          git add src/pages/DokumenPendukungPage.tsx
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Expected integration was not staged.'; exit 1; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(tools): use product-first browser for non-publishers'
          git push origin HEAD:refs/heads/feat/marketing-tools-product-first
